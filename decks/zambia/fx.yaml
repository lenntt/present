# How the deck moves. Content lives in content.md; this file only adds motion.
# Times are in beats (b) at `tempo`; ms/s also work.
tempo: 120

defaults:
  transition: fade
  emphasis: neon-glow
  heading: scramble-heading

slides:
  cover:
    intent: The talk boots up like a terminal session — kicker types, title decodes, speaker details settle in.
    effects:
      - target: .cover-kicker
        custom: type-in
      - target: .cover-meta p
        custom: rise-in
        params: { at: 3b, stagger: 0.5b, y: 24 }

  slide-1:
    intent: Hard cut into the music video — no transition between "us" and "it".
    transition: none


  venlo:
    intent: A live map, starting far away with Venlo pinned — I zoom in by hand, from Zambia to my campus.
    heading: none
    effects:
      - target: figure.media
        custom: rise-in
        params: { at: 0.5b }

  tell-me-something-about-you:
    intent: Phones out — the QR gets scanned on screen, then Bit pops out of its flask to say hello.
    heading: none
    effects:
      - target: figure.media
        custom: qr-scan
      - preset: bit
        params:
          place: { left: 300px, bottom: 110px }
          enter: emerge
          at: 4.5b
          play: [wave]

  software-engineers-rely-on-ai-sept-2025:
    intent: Two charts, one at a time, so the room reads the first before the second lands.
    effects:
      - target: figure.media
        custom: rise-in
        params: { stagger: 2b }

  ai-impact:
    intent: The question types itself out and "sacrificing quality" lights up; Bit rides a slider at "vibe coding" — the click slides it to "stay in control", the next one slams down "Accountability → you".
    effects:
      - target: .col-main > p:first-of-type
        custom: type-in
        params: { by: words, at: 0.5b, speed: 4 }
      - custom: control-slider        # author hint: Bit operating a slider from vibe coding to staying in control, after the question
        params: { at: 5.5b, left: 120px, top: 470px, from: vibe coding, to: stay in control }
      - target: .col-main > p:last-of-type > strong
        custom: rubber-stamp          # last click, once Bit has made it to "stay in control"
    emphasisParams: { delay: 4b }   # "sacrificing quality" lights up once the question has typed out

  career:
    intent: Let the line draw my career left to right; Fontys is the destination.
    components:
      timeline:
        duration: 8b
    effects:
      - target: .component.more
        custom: rise-in
        params: { at: 9b, y: 16 }   # the LinkedIn pointer arrives quietly once Fontys has landed

  ai-in-software-development:
    intent: The line runs from Copilot into the unknown (2027+); once it reaches the arrow, Bit pops up above it and ponders what's next.
    components:
      timeline:
        duration: 7b
    effects:
      - preset: bit
        params:
          place: { right: 150px, top: 150px }
          size: 220
          enter: emerge
          at: 7.5b
          play: [think]

  vibe-coding:
    intent: FAAFO lands as keycaps; "great for experiments" uncorks Bit, who happily codes away — then "professionally" slams down as the verdict.
    effects:
      - target: ul strong
        preset: keycap-stamp
      - target: .slide-body > p:nth-of-type(2)   # "Great for quick feedback, experiments…"
        preset: bit
        params:
          place: { right: 200px, bottom: 200px }
          enter: emerge
          at: 0.5b
          play: [writeCode]
      - target: .slide-body > p:last-of-type > strong
        custom: rubber-stamp
        params: { onEntrance: true, at: 1.5b }   # slams down as its line appears

  amplifier:
    intent: Zoom in — AI magnifies whatever is already there, good or bad; the two charts land one after the other.
    transition: zoom
    effects:
      - target: figure.media
        custom: rise-in
        params: { stagger: 2b }

  lgtm:
    intent: 'Code review, live — the agent''s "fix: make tests pass" diff types itself out; the room votes, the click reveals it changed the tests instead of the code, and "Green ≠ correct" slams down.'
    effects:
      - target: pre code
        custom: type-in
        params: { by: words, at: 0.5b, speed: 10 }
      - target: .slide-body > p:last-of-type > strong
        custom: rubber-stamp
        params: { onEntrance: true, at: 1b }

  tooling:
    intent: Don't vs Instead — as the slide lands, the webchat gets struck out and the real tools get the check; the terminal rises in as proof.
    effects:
      - target: .slide-body ul
        custom: dont-instead
      - target: figure.media
        custom: rise-in
        params: { at: 1b }

  plan:
    intent: '"Make no mistakes" gets struck out; instead the AI asks first — Bit pops a question bubble.'
    effects:
      - target: .slide-body ul
        custom: dont-instead
      - preset: bit
        params:
          mood: neutral
          at: 1b
          playAt: 3b
          play: [{ motion: ask, args: { keep: true } }]

  context:
    intent: Context rot — the endless session gets struck out while the context window fills up and the answers get "dumber"; "start over" drops a fresh, nearly empty session on top.
    effects:
      - target: .slide-body ul
        custom: dont-instead
      - custom: context-window        # author hint: what's in the context, and that it gets 'dumber' when full
        params: { at: 2.5b }
      - target: .slide-body > p.fragment
        custom: context-window
        params: { clear: true }

  small:
    intent: The big build gets struck out; one big block is sliced into thin vertical stories, and the first slice lights up — small enough to validate.
    effects:
      - target: .slide-body ul
        custom: dont-instead
      - custom: story-slices
        params: { at: 3.5b }

  custom-skills:
    intent: The command types itself like a wish; then the skill behind it writes itself out as a short .md recipe, each step ticked off.
    effects:
      - target: .slide-body li code
        custom: type-in
        params: { at: 1b }
      - custom: skill-file
        params:
          at: 5b
          title: deck-spice/SKILL.md
          lines: [read the deck, pick the slides, direct each slide, write fx.yaml, run present check → ok]

  final:
    intent: '"you are accountable" lights up; on the next click "learning" and "AI cannot learn for you" land and Bit takes the hint, corking itself in its flask; then "curious, experiment" and the personal project — and the last click leaves the human with the job: "make the world a better place".'
    effects:
      # one glow sequence per part, so each key word lands right after its own click
      - target: .slide-body > ul:nth-of-type(1) mark
        preset: neon-glow
        params: { delay: 1b, stagger: 1b }        # you 1b, accountable 2b
      - target: .slide-body > ul:nth-of-type(2) mark
        preset: neon-glow
        params: { delay: 0.5b, stagger: 1b }      # learning 0.5b, "AI cannot learn for you" 1.5b
      - target: .slide-body > ul:nth-of-type(3) mark
        preset: neon-glow
        params: { delay: 0.5b, stagger: 1b }      # curious 0.5b, experiment 1.5b
      - target: .slide-body > ul:nth-of-type(4) mark
        preset: neon-glow
        params: { delay: 0.5b }
      - target: .slide-body > ul:nth-of-type(2)  # Bit stands there from the start; its motion plays with this part
        preset: bit
        params:
          place: { right: 280px, bottom: 120px }
          size: 400
          mood: happy
          enter: none
          playAt: 2.5b                # right after "AI cannot learn for you" lands
          play: [retreat]

  questions:
    intent: Q&A — the Menti QR asks what they'll build first; Bit pops back out of its flask to wave the room in, then ponders along while the session clock counts down.
    effects:
      - preset: bit
        params:
          place: { left: 620px, bottom: 70px }
          size: 300
          enter: emerge
          at: 1b
          play: [wave, think]
